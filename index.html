<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradingView Screenshot Replica</title>
  <style>
    :root {
      --bg: #e5e5e5;
      --panel: #f4f4f4;
      --chart-bg: #f9f9f9;
      --grid: rgba(17, 20, 26, 0.08);
      --border: #d7dbe0;
      --text: #2e3137;
      --muted: #69747d;
      --green: #1ba97d;
      --red: #e74c5d;
      --blue: #2b74f1;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
    }

    .app {
      width: 100%;
      max-width: 1280px;
      height: 100vh;
      background: var(--panel);
      border-left: 1px solid #d2d5db;
      border-right: 1px solid #d2d5db;
      position: relative;
      overflow: hidden;
    }

    .topbar {
      height: 30px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px 0 12px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.18);
      white-space: nowrap;
      overflow: hidden;
      font-size: 11px;
    }

    .pair {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      min-width: 0;
    }

    .pair-name {
      font-size: 12px;
      font-weight: 500;
    }

    .pair-suffix {
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
    }

    .price-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .price-meta .value {
      font-size: 12px;
      color: #2a2e34;
    }

    .price-meta .delta {
      color: var(--red);
      font-size: 11px;
    }

    .badge-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 60px;
      padding: 3px 7px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: 700;
      border: 1px solid transparent;
      line-height: 1.1;
    }

    .badge.sell {
      color: var(--red);
      border-color: rgba(231,76,93,0.4);
      background: rgba(231,76,93,0.08);
    }

    .badge.buy {
      color: var(--green);
      border-color: rgba(26,169,125,0.4);
      background: rgba(26,169,125,0.08);
    }

    .right-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
    }

    .orb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1ba97d;
      display: inline-block;
      box-shadow: 0 0 0 1px rgba(27,169,125,0.08);
    }

    .price-area {
      position: relative;
      height: calc(100% - 30px - 52px);
      background: #f5f5f5;
      overflow: hidden;
      border-bottom: 1px solid var(--border);
    }

    .chart-grid {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, rgba(17,18,22,0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(17,18,22,0.06) 1px, transparent 1px),
        var(--chart-bg);
      background-size: 36px 24px, 36px 24px, 100% 100%;
    }

    .price-axis {
      position: absolute;
      top: 0;
      right: 0;
      width: 58px;
      height: 100%;
      border-left: 1px solid var(--border);
      background: rgba(255,255,255,0.12);
      z-index: 2;
      padding: 4px 6px 4px 0;
      text-align: right;
      color: #5c636c;
      font-size: 10px;
    }

    .price-axis span {
      display: block;
      height: calc((100% - 20px) / 14);
      line-height: 1;
      padding-top: 2px;
      font-weight: 500;
    }

    .candles {
      position: absolute;
      left: 0;
      right: 58px;
      top: 0;
      bottom: 0;
      z-index: 3;
    }

    .candle {
      position: absolute;
      width: 6px;
      transform: translateX(-50%);
    }

    .candle::before {
      content: "";
      position: absolute;
      left: 2px;
      top: -9px;
      width: 1px;
      height: calc(100% + 18px);
      background: currentColor;
      opacity: 0.9;
    }

    .candle.up { background: var(--green); color: var(--green); }
    .candle.down { background: var(--red); color: var(--red); }

    .floating-box {
      position: absolute;
      left: 12px;
      top: 9px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 10px;
    }

    .floating-box .entry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 56px;
      padding: 3px 5px;
      border-radius: 3px;
      border: 1px solid rgba(29,169,125,0.4);
      background: rgba(255,255,255,0.86);
      color: var(--green);
      font-weight: 700;
      line-height: 1.1;
    }

    .floating-box .entry.red {
      color: var(--red);
      border-color: rgba(231,76,93,0.4);
    }

    .floating-box .entry.blue {
      color: var(--blue);
      border-color: rgba(29,115,245,0.4);
    }

    .current-line {
      position: absolute;
      left: 0;
      right: 58px;
      top: 0;
      bottom: 0;
      z-index: 4;
      pointer-events: none;
    }

    .current-line::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 48%;
      border-top: 1px solid rgba(231,76,93,0.7);
      box-shadow: 0 0 0 1px rgba(231,76,93,0.05);
    }

    .tv-badge {
      position: absolute;
      left: 8px;
      bottom: 7px;
      z-index: 5;
      width: 26px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #3d454d;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: rgba(255,255,255,0.2);
      font-weight: 700;
    }

    .bottom {
      height: 52px;
      border-top: 1px solid var(--border);
      background: #f7f7f7;
      position: relative;
    }

    .timeline {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 90px 0 82px;
      color: #5d6570;
      font-size: 10px;
      text-align: center;
    }

    .footer {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 26px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px 0 9px;
      border-top: 1px solid var(--border);
      background: rgba(255,255,255,0.2);
      color: #5c646c;
      font-size: 10px;
    }

    .footer .group {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #69737d;
      font-weight: 500;
    }

    .footer .group .active {
      color: #2f343b;
      font-weight: 700;
    }

    .clock {
      margin-left: auto;
      font-weight: 600;
      color: #4b5057;
    }

    .gear {
      font-size: 12px;
      margin-left: 4px;
      color: #4d555d;
    }
  </style>
</head>
