<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chart UI Replica</title>
  <style>
    :root {
      --bg: #f3f3f4;
      --sidebar: #efefef;
      --toolbar: #f1f1f1;
      --panel: #f5f5f5;
      --chart-bg: #f9f9f9;
      --border: #d7d7d7;
      --text: #3c3d42;
      --muted: #8e8f94;
      --green: #19aa76;
      --green-soft: rgba(25,170,118,0.15);
      --red: #ea4c52;
      --red-soft: rgba(234,76,82,0.15);
      --blue: #2e7dff;
      --blue-soft: rgba(46,125,255,0.12);
      --shadow: rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      background: var(--bg);
    }

    .sidebar {
      width: 74px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 8px;
      position: relative;
    }

    .hamburger {
      width: 100%;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
      color: #3d3d42;
      font-size: 22px;
      font-weight: 500;
    }

    .tool-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .tool {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      color: #4a4b50;
      opacity: 0.92;
      position: relative;
      cursor: default;
    }

    .tool.active {
      border: 2px solid #ff4d4f;
      background: rgba(255,255,255,0.55);
      box-shadow: inset 0 0 0 1px rgba(255,77,79,0.08);
    }

    .tool svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tool.icon-pen svg {
      width: 19px;
      height: 19px;
    }

    .tool.icon-select svg {
      width: 17px;
      height: 17px;
    }

    .tool.icon-trend svg {
      width: 18px;
      height: 18px;
    }

    .tool.icon-eraser svg {
      width: 17px;
      height: 17px;
    }

    .tool.icon-magnify svg {
      width: 18px;
      height: 18px;
    }

    .tool.icon-box svg {
      width: 18px;
      height: 18px;
    }

    .tool.icon-diagonal svg {
      width: 18px;
      height: 18px;
    }

    .tool.icon-delete svg {
      width: 18px;
      height: 18px;
    }

    .tool.icon-trash svg {
      width: 18px;
      height: 18px;
    }

    .tool.icon-zoom svg {
      width: 18px;
      height: 18px;
    }

    .tool.icon-move svg {
      width: 18px;
      height: 18px;
    }

    .tool.icon-hand svg {
      width: 18px;
      height: 18px;
    }

    .spacer {
      flex: 1;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--chart-bg);
    }

    .topbar {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 14px 0 14px;
      background: rgba(255,255,255,0.2);
      border-bottom: 1px solid var(--border);
      gap: 12px;
      position: relative;
    }

    .pair {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 6px;
      white-space: nowrap;
    }

    .pair-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #2d2e32;
    }

    .pair .small {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      margin-right: 8px;
    }

    .timeframe {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 7px;
      border-radius: 7px;
      color: #6d6f76;
      border: 1px solid transparent;
      background: transparent;
      cursor: default;
    }

    .timeframe.active {
      background: rgba(0,0,0,0.04);
      color: #2f3238;
      border-color: rgba(0,0,0,0.04);
    }

    .price-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: 8px;
    }

    .price-current {
      font-size: 13px;
      color: #1f2126;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .market-badges {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.01em;
      min-width: 72px;
      border: 1px solid transparent;
    }

    .badge.buy {
      background: rgba(25,170,118,0.10);
      color: var(--green);
      border-color: rgba(25,170,118,0.14);
    }

    .badge.sell {
      background: rgba(234,76,82,0.10);
      color: var(--red);
      border-color: rgba(234,76,82,0.14);
    }

    .chart-area {
      position: relative;
      flex: 1;
      min-height: 0;
      background: var(--chart-bg);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: var(--chart-bg);
    }

    .floating-label {
      position: absolute;
      left: 18px;
      top: 18px;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(0,0,0,0.04);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 11px;
      color: #5b5d63;
      display: none;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="hamburger">☰</div>

      <div class="tool-group">
        <div class="tool active icon-pen" title="Select">
          <svg viewBox="0 0 24 24"><path d="M4 20l5.5-1.5L19.5 8.5a2.1 2.1 0 0 0-3-3L6.5 15.5 5 20z"/><path d="M13.5 7.5l3 3"/></svg>
        </div>
        <div class="tool icon-select" title="Move">
          <svg viewBox="0 0 24 24"><path d="M6 18l4.7-12.5 2.7 7.5 7.6 2.5L6 18z"/></svg>
        </div>
        <div class="tool icon-trend" title="Trend line">
          <svg viewBox="0 0 24 24"><path d="M3 17l6-6 5 5 8-10"/></svg>
        </div>
        <div class="tool icon-eraser" title="Eraser">
          <svg viewBox="0 0 24 24"><path d="M7 15l7-7 5 5-7 7H7z"/><path d="M15 20H7l-3-3 8-8"/></svg>
        </div>
        <div class="tool icon-magnify" title="Magnify">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="5.5"/><path d="M16 16l5 5"/></svg>
        </div>
        <div class="tool icon-box" title="Rectangle">
          <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg>
        </div>
        <div class="tool icon-diagonal" title="Text">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v10H7z"/><path d="M7 17l10-10"/></svg>
        </div>
        <div class="tool icon-delete" title="Delete">
          <svg viewBox="0 0 24 24"><path d="M6 7h12"/><path d="M9 7V5h6v2"/><path d="M8 7l1 12h6l1-12"/></svg>
        </div>
        <div class="tool icon-trash" title="Trash">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v12H7z"/><path d="M4 7h16"/><path d="M10 7V4h4v3"/></svg>
        </div>
      </div>

      <div class="spacer"></div>

      <div class="tool-group bottom-tools">
        <div class="tool icon-hand" title="Hand">
          <svg viewBox="0 0 24 24"><path d="M8 11V7.5a1.5 1.5 0 0 1 3 0V11"/><path d="M11 11V5.5A1.5 1.5 0 0 1 14.5 5v6"/><path d="M14.5 11V7.5a1.5 1.5 0 0 1 3 0V11"/><path d="M8 11v5.5a3.5 3.5 0 0 0 3.5 3.5H12a3.5 3.5 0 0 0 3.5-3.5V11"/></svg>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="pair">
          <span class="pair-name">BTCUSDT</span>
          <span class="small">+</span>
        </div>

        <div class="price-row">
          <div class="price-current">108,005.49</div>
          <div class="price-current" style="color: var(--red); font-size: 12px; margin-left: 4px;">0.01</div>
        </div>

        <div class="market-badges">
          <span class="badge sell">SELL</span>
          <span class="badge buy">BUY</span>
        </div>

        <div class="top-actions">
          <div class="timeframe">5m</div>
          <div class="timeframe">30m</div>
          <div class="timeframe active">1h</div>
          <div class="timeframe">4h</div>
          <div class="timeframe">D</div>
          <div class="timeframe">W</div>
        </div>
      </div>

      <div class="chart-area">
        <canvas id="chartCanvas"></canvas>
        <div class="floating-label">Live</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');

    let chartData = [];
    let currentPrice = 108005.49;
    let candleStart = Date.now();
    let currentCandle = null;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function getCandleDuration() {
      return 60 * 60 * 1000;
    }

    function createCandle(open, close, high, low, volume, start) {
      return { open, close, high, low, volume, start, end: start + getCandleDuration() };
    }

    function seedCandles() {
      const candles = [];
      let prev = 108005.49;
      for (let i = 80; i >= 0; i--) {
        const start = Date.now() - i * getCandleDuration();
        const drift = (Math.random() - 0.48) * 140;
        const open = prev;
        const close = clamp(open + drift, 106800, 109600);
        const high = Math.max(open, close) + Math.random() * 180;
        const low = Math.min(open, close) - Math.random() * 180;
        const vol = 800 + Math.random() * 1800;
        candles.push(createCandle(open, close, high, low, vol, start));
        prev = close;
      }
      return candles;
    }

    function setCurrentCandle() {
      const price = currentPrice;
      currentCandle = createCandle(price, price, price, price, 0, Date.now());
    }

    function finalizeCandle() {
      if (!currentCandle) return;
      const c = {
        ...currentCandle,
        close: currentPrice,
        high: Math.max(currentCandle.high, currentPrice),
        low: Math.min(currentCandle.low, currentPrice),
      };
      chartData.push(c);
      setCurrentCandle();
    }

    function randomWalk() {
      const tick = (Math.random() - 0.5) * 30;
      const trend = Math.sin(Date.now() / 8000) * 6;
      currentPrice += tick + trend;
      currentPrice = clamp(currentPrice, 106000, 109500);

      if (!currentCandle) setCurrentCandle();
      currentCandle.close = currentPrice;
      currentCandle.high = Math.max(currentCandle.high, currentPrice);
      currentCandle.low = Math.min(currentCandle.low, currentPrice);
      currentCandle.volume += 10 + Math.random() * 30;

      if (Date.now() - currentCandle.start >= getCandleDuration()) finalizeCandle();
    }

    function drawCandle(candle, x, yScale, w, up) {
      const openY = yScale(candle.open);
      const closeY = yScale(candle.close);
      const highY = yScale(candle.high);
      const lowY = yScale(candle.low);

      ctx.beginPath();
      ctx.moveTo(x, highY);
      ctx.lineTo(x, lowY);
      ctx.strokeStyle = up ? '#1ba978' : '#ea4c52';
      ctx.lineWidth = 1.1;
      ctx.stroke();

      const top = Math.min(openY, closeY);
      const bodyH = Math.max(3, Math.abs(closeY - openY));
      ctx.fillStyle = up ? '#1ba978' : '#ea4c52';
      ctx.fillRect(x - w / 2, top, w, bodyH);
    }

    function drawGridAndCandles() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = '#f9f9f9';
      ctx.fillRect(0, 0, width, height);

      const allCandles = [...chartData, ...(currentCandle ? [currentCandle] : [])];
      if (!allCandles.length) return;

      let min = Infinity;
      let max = -Infinity;
      allCandles.forEach(c => {
        min = Math.min(min, c.low);
        max = Math.max(max, c.high);
      });

      const pad = (max - min) * 0.16 || 20;
      min -= pad;
      max += pad;

      const yScale = (v) => {
        const range = max - min || 1;
        return height - 16 - ((v - min) / range) * (height - 24);
      };

      const left = 20;
      const right = 10;
      const candleCount = Math.max(40, allCandles.length);
      const candleWidth = 5.8;

      ctx.strokeStyle = 'rgba(0,0,0,0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 7; i++) {
        const y = 8 + (i * (height - 24)) / 7;
        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(width - right, y);
        ctx.stroke();
      }

      for (let i = 0; i <= 15; i++) {
        const x = left + (i * (width - left - right)) / 15;
        ctx.beginPath();
        ctx.moveTo(x, 8);
        ctx.lineTo(x, height - 10);
        ctx.stroke();
      }

      const lastX = width - 20;
      let xPos = lastX;
      for (let i = allCandles.length - 1; i >= 0; i--) {
        const candle = allCandles[i];
        const up = candle.close >= candle.open;
        drawCandle(candle, xPos, yScale, candleWidth, up);
        xPos -= 8;
      }
    }

    function animate() {
      randomWalk();
      drawGridAndCandles();
      requestAnimationFrame(animate);
    }

    function init() {
      chartData = seedCandles();
      setCurrentCandle();
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      animate();
    }

    init();
  </script>
</body>
</html>
